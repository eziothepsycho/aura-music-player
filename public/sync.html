<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aura WebRTC Sync — Companion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            aura: {
              400: '#c084fc',
              500: '#a855f7',
              600: '#9333ea',
              700: '#7e22ce',
            },
            dark: {
              950: '#06070b',
              900: '#0c0e17',
              850: '#121524',
              800: '#191d30',
              750: '#222742',
              700: '#2d3354',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #06070b;
      color: #e2e8f0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .glow-disc {
      box-shadow: 0 0 40px rgba(168, 85, 247, 0.4);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto">
  <!-- Header -->
  <header class="text-center pt-4 pb-2">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-aura-600 to-indigo-600 text-white shadow-lg glow-disc mb-3">
      <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
      </svg>
    </div>
    <h1 class="text-2xl font-extrabold tracking-tight text-white">Aura WebRTC Sync</h1>
    <p class="text-xs text-slate-400 mt-0.5 font-medium">Direct Peer-to-Peer Wireless Phone Sync</p>
  </header>

  <!-- Main Container -->
  <main class="flex-1 flex flex-col justify-center space-y-4 my-2">
    <!-- Step 1: Pairing -->
    <div id="pairingCard" class="bg-dark-900 border border-dark-800 rounded-3xl p-6 shadow-xl space-y-4">
      <div class="flex items-center justify-between">
        <span class="text-xs font-bold text-slate-300 uppercase tracking-wider">Pair with PC</span>
        <span id="p2pStatus" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold bg-amber-500/15 text-amber-300 border border-amber-500/30">
          <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-ping"></span>
          Ready to Connect
        </span>
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-400 block mb-1.5">Enter 6-Digit Code from Aura Desktop:</label>
        <div class="relative">
          <input
            id="codeField"
            type="number"
            pattern="[0-9]*"
            inputmode="numeric"
            placeholder="e.g. 842915"
            maxlength="6"
            class="w-full bg-dark-850 border border-dark-750 focus:border-aura-500 rounded-2xl px-4 py-3.5 text-center text-2xl font-mono font-bold tracking-widest text-white outline-none transition-all placeholder:text-dark-700 placeholder:text-base placeholder:font-sans"
          />
        </div>
      </div>

      <button
        id="connectBtn"
        onclick="connectToPc()"
        class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-aura-600 to-indigo-600 hover:from-aura-500 hover:to-indigo-500 text-white font-bold text-sm shadow-lg shadow-aura-900/50 active:scale-[0.98] transition-all flex items-center justify-center gap-2"
      >
        <span>Connect Peer-to-Peer</span>
      </button>
    </div>

    <!-- Step 2: File Selector & Transfer (Hidden until connected) -->
    <div id="transferCard" class="hidden bg-dark-900 border border-dark-800 rounded-3xl p-6 shadow-xl space-y-5">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="text-xs font-bold text-white">Connected to Aura PC</span>
        </div>
        <span class="text-[10px] font-mono text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">P2P Encrypted</span>
      </div>

      <!-- File Pick Zone -->
      <label class="block border-2 border-dashed border-dark-750 hover:border-aura-500/50 bg-dark-850/50 rounded-2xl p-6 text-center cursor-pointer transition-all">
        <input id="audioInput" type="file" multiple accept="audio/*" class="hidden" onchange="handleFilesSelected(this.files)" />
        <div class="w-12 h-12 mx-auto rounded-2xl bg-dark-800 text-aura-400 flex items-center justify-center mb-2">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
        </div>
        <p class="text-xs font-bold text-white">Tap to Choose Music Files</p>
        <p class="text-[11px] text-slate-400 mt-1">MP3, FLAC, M4A, WAV, OGG</p>
      </label>

      <!-- Selected files count -->
      <div id="selectedInfo" class="hidden text-xs text-slate-300 flex items-center justify-between bg-dark-850 px-4 py-2.5 rounded-xl border border-dark-750">
        <span id="selectedCountText">0 songs selected</span>
        <span id="selectedSizeText" class="font-mono text-aura-300">0 MB</span>
      </div>

      <!-- Start Transfer Button -->
      <button
        id="syncBtn"
        disabled
        onclick="startTransfer()"
        class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-aura-600 via-indigo-600 to-emerald-600 disabled:opacity-40 disabled:cursor-not-allowed text-white font-bold text-sm shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-2"
      >
        <span>Send Music to PC</span>
      </button>

      <!-- Progress Section -->
      <div id="progressSection" class="hidden space-y-2 pt-2 border-t border-dark-800">
        <div class="flex items-center justify-between text-xs font-mono">
          <span id="progressFileName" class="text-aura-300 font-semibold truncate max-w-[200px]">Transferring...</span>
          <span id="progressPercent" class="text-white font-bold">0%</span>
        </div>
        <div class="w-full h-2.5 bg-dark-800 rounded-full overflow-hidden">
          <div id="progressBar" class="h-full bg-gradient-to-r from-aura-500 to-emerald-400 rounded-full transition-all duration-200" style="width: 0%"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer Info -->
  <footer class="text-center text-[11px] text-slate-500 pb-2">
    <p>Safe Sync Protected • PC retains local copies offline</p>
  </footer>

  <script>
    let peer = null;
    let conn = null;
    let selectedFiles = [];

    // Auto-fill code from URL query parameter e.g. ?code=123456
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      if (code) {
        document.getElementById('codeField').value = code;
        setTimeout(() => connectToPc(), 500);
      }
    });

    function updateStatus(text, type) {
      const el = document.getElementById('p2pStatus');
      el.textContent = text;
      el.className = `inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold ${
        type === 'success' ? 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30' :
        type === 'error' ? 'bg-rose-500/15 text-rose-400 border border-rose-500/30' :
        'bg-amber-500/15 text-amber-300 border border-amber-500/30'
      }`;
    }

    function connectToPc() {
      const code = document.getElementById('codeField').value.trim();
      if (!code || code.length < 5) {
        alert('Please enter the 6-digit code shown in Aura Desktop');
        return;
      }

      updateStatus('Connecting to PC...', 'warning');
      const targetPeerId = `aura-sync-${code}`;

      if (!peer) {
        peer = new Peer({
          config: {
            iceServers: [
              { urls: 'stun:stun.l.google.com:19302' },
              { urls: 'stun:global.stun.twilio.com:3478' }
            ]
          }
        });

        peer.on('open', (id) => {
          console.log('Mobile Peer initialized:', id);
          initiateConnection(targetPeerId);
        });

        peer.on('error', (err) => {
          console.error('Peer error:', err);
          updateStatus('Connection Error', 'error');
          alert('Could not connect. Please check the code and ensure Aura is open on your PC.');
        });
      } else {
        initiateConnection(targetPeerId);
      }
    }

    function initiateConnection(targetId) {
      conn = peer.connect(targetId, { reliable: true });

      conn.on('open', () => {
        console.log('Connected to PC!');
        updateStatus('Connected!', 'success');
        document.getElementById('pairingCard').classList.add('hidden');
        document.getElementById('transferCard').classList.remove('hidden');
      });

      conn.on('data', (data) => {
        console.log('Received from PC:', data);
      });

      conn.on('close', () => {
        alert('Connection to PC closed');
        location.reload();
      });
    }

    function handleFilesSelected(files) {
      selectedFiles = Array.from(files);
      if (selectedFiles.length === 0) return;

      const totalBytes = selectedFiles.reduce((acc, f) => acc + f.size, 0);
      const mb = (totalBytes / (1024 * 1024)).toFixed(1);

      document.getElementById('selectedInfo').classList.remove('hidden');
      document.getElementById('selectedCountText').textContent = `${selectedFiles.length} song${selectedFiles.length > 1 ? 's' : ''} selected`;
      document.getElementById('selectedSizeText').textContent = `${mb} MB`;
      document.getElementById('syncBtn').disabled = false;
    }

    async function startTransfer() {
      if (!conn || selectedFiles.length === 0) return;

      const syncBtn = document.getElementById('syncBtn');
      syncBtn.disabled = true;
      syncBtn.textContent = 'Transferring...';

      document.getElementById('progressSection').classList.remove('hidden');

      const CHUNK_SIZE = 64 * 1024; // 64 KB chunks

      for (let i = 0; i < selectedFiles.length; i++) {
        const file = selectedFiles[i];
        document.getElementById('progressFileName').textContent = `[${i + 1}/${selectedFiles.length}] ${file.name}`;
        
        // Signal start
        conn.send({
          type: 'file-start',
          fileName: file.name,
          fileSize: file.size,
          mimeType: file.type
        });

        // Read and send in chunks
        const arrayBuffer = await file.arrayBuffer();
        const totalChunks = Math.ceil(arrayBuffer.byteLength / CHUNK_SIZE);

        for (let c = 0; c < totalChunks; c++) {
          const start = c * CHUNK_SIZE;
          const end = Math.min(arrayBuffer.byteLength, start + CHUNK_SIZE);
          const chunk = arrayBuffer.slice(start, end);

          conn.send({
            type: 'file-chunk',
            chunk: chunk
          });

          const percent = Math.round(((c + 1) / totalChunks) * 100);
          document.getElementById('progressBar').style.width = `${percent}%`;
          document.getElementById('progressPercent').textContent = `${percent}%`;

          // Small yield for buffer drain
          if (c % 10 === 0) {
            await new Promise(r => setTimeout(r, 10));
          }
        }

        // Signal end
        conn.send({
          type: 'file-end',
          fileName: file.name
        });

        await new Promise(r => setTimeout(r, 200));
      }

      document.getElementById('progressFileName').textContent = '✅ All Songs Transferred!';
      document.getElementById('progressBar').style.width = '100%';
      document.getElementById('progressPercent').textContent = '100%';
      syncBtn.textContent = 'Transfer Complete!';
      syncBtn.classList.remove('from-aura-600', 'via-indigo-600', 'to-emerald-600');
      syncBtn.classList.add('bg-emerald-600');
    }
  </script>
</body>
</html>
